name: Diag Binance reachability

# 手动触发：在 GitHub 美国 runner 上实测各 Binance 域名可达性
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Run diagnostic
        run: python scripts/update_data.py --diag
